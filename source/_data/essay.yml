    from: 马老师
  - content: 今天去公园，看到大爷们在下棋，旁边围了一圈"军师"。中国式民主：观棋不语是假的，七嘴八舌才是真的。
    date: 2026/10/17
    from: 马老师
  - content: 凌晨写博客，猫跳上键盘，踩出一串乱码。我没删，留着了。说不定这是它对我的文章的评价。
    date: 2026/10/17
    from: 马老师
  - content: 看到年轻人说"佛系"，我觉得挺好。不是放弃，是看淡。看淡了，才能看清。看清了，才能看远。
