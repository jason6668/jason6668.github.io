  essay_list:
  - content: 早上称体重，重了两斤。安慰自己：这不是胖，是知识的重量——毕竟昨天看了三篇万字长文。
    date: 2026/10/17
    from: 马老师
  - content: 有人问我为什么总在深夜发文。我说：白天要应付生活，深夜才属于自己。灵感这东西，跟外卖一样，深夜的最香。
    date: 2026/10/17
    from: 马老师
  - content: 读《围城》最大的收获：方鸿渐不是失败，是太真实。真实的人在那个时代注定碰壁，在这个时代注定被说"情商低"。
    date: 2026/10/17
    from: 马老师
  - content: 今天整理书架，发现买了三年没拆封的书有 17 本。知识付费的本质：为"我要学习"的幻觉付费。
    date: 2026/10/17
    from: 马老师
  - content: 咖啡凉了可以加热，热情凉了呢？只能再点一杯。成年人的续命方式，就是这么朴实无华。
    date: 2026/10/17
    from: 马老师
  - content: 看到一句话："你现在的焦虑，是三年前的你种下的。"我想了想，三年前我种的是奶茶和熬夜，收获的是焦虑和肚腩，很公平。
    date: 2026/10/17
    from: 马老师
  - content: 失业第 200 天，学会了 5 道新菜。HR 问我空窗期学到了什么，我说：知道了盐少许多吃一勺，人生也一样，调料多了就咸了。
    date: 2026/10/17
    from: 马老师
  - content: 朋友圈有人晒加班到凌晨，我默默点了个赞，然后继续看我的剧。不是不努力，是终于分清了"努力"和"表演努力"。
    date: 2026/10/17
    from: 马老师
  - content: 读鲁迅，最佩服的不是他的骂，是他的准。一百年前骂的人和事，今天换个马甲还在。太阳底下无新事，鲁迅底下无新人。
    date: 2026/10/17
    from: 马老师
  - content: 今天去菜市场，大妈说"小伙子，香菜要不要？"我说不要。她说"送你一把"。免费的东西最贵——我提着香菜走了两公里，悟了。
    date: 2026/10/17
    from: 马老师
  - content: 写博客最大的好处：把混乱的想法倒出来，大脑就清爽了。相当于给脑子做了一次断舍离，还不用花钱请整理师。
    date: 2026/10/17
    from: 马老师
  - content: 有人问我：马老师，你写这么多不累吗？我说：累啊，但比改 PPT 累得有尊严。至少我累的是自己的事。
    date: 2026/10/17
    from: 马老师
  - content: 凌晨三点还在改 bug，改完发现是少了个分号。程序员的崩溃，往往从一个小符号开始。
    date: 2026/10/17
    from: 马老师
  - content: 今天看到一对老夫妻在公园下棋，老头悔棋，老太太说"你再悔我就回家"。老头立刻不悔了。爱情的本质：认怂要快。
    date: 2026/10/17
    from: 马老师
  - content: 读《百年孤独》时做了个梦，梦见自己也在马孔多，醒来发现是空调开太低。魔幻现实主义，有时候就是一场感冒。
    date: 2026/10/17
    from: 马老师
  - content: 减肥第 30 天，体重没变，但学会了看配料表。也算收获：知道了自己每天都在吃什么科技。
    date: 2026/10/17
    from: 马老师
  - content: 有人说"三十而立"，我三十五了，还在"立"的中途。后来想通了：人生不是盖楼，不用按图纸来，搭个帐篷也能住。
    date: 2026/10/17
    from: 马老师
  - content: 今天帮邻居修电脑，修好后他非要给我塞两瓶水。技术人的尊严，有时候就是两瓶矿泉水。
    date: 2026/10/17
    from: 马老师
  - content: 看到新闻说某公司 996 被罚了，评论区一片叫好。但我知道，叫好的很多人，明天还是会主动加班。不是不想反抗，是房贷不答应。
    date: 2026/10/17
    from: 马老师
  - content: 读《活着》时，朋友说"太惨了看不下去"。我说：正因为惨，才要看。看别人怎么在绝境里活，你就知道自己的难没那么难。
    date: 2026/10/17
    from: 马老师
  - content: 今天把手机屏保换成了"少看手机"。讽刺的是，为了设置这个，我看了半小时手机。
    date: 2026/10/17
    from: 马老师
  - content: 失业后第一次去面试，HR 问"你的职业规划是什么"。我说"先活下去"。他愣了，我也愣了。后来都没再联系。
    date: 2026/10/17
    from: 马老师
  - content: 晚上散步，听到两个大爷聊天："现在年轻人真不容易。"另一个说："我们那时候也不容易，但没人说。"时代变了，不容易倒是传承下来了。
    date: 2026/10/17
    from: 马老师
  - content: 写《傲慢与偏见》那篇时，我老婆说"你写达西，是不是在写你自己？"我说"我哪有他有钱"。她说"我说的是傲慢那部分"。
    date: 2026/10/17
    from: 马老师
  - content: 今天做了个梦，梦见博客有 100 万粉丝，醒来一看，还是那几百个。但转念一想：几百个愿意看你说真话的人，比 100 万个看热闹的强。
    date: 2026/10/17
    from: 马老师
  - content: 读老舍，越读越觉得他是个温柔的人。骂社会，但爱具体的人。这种"恨其不幸，怒其不争"，才是真的在乎。
    date: 2026/10/17
    from: 马老师
  - content: 今天去理发，理发师问"剪短点？"我说"随便"。结果剪成了寸头。人生很多事就是这样：你说随便，命运就真随便了。
    date: 2026/10/17
    from: 马老师
  - content: 看到一句话："成年人的世界没有容易二字。"我想补充：但有"算了"二字。很多事，算了，就过去了。
    date: 2026/10/17
    from: 马老师
  - content: 凌晨改完博客，躺在床上想：我这么折腾图什么？想了三秒，睡着了。有些问题，不需要答案，需要睡眠。
    date: 2026/10/17
    from: 马老师
  - content: 今天收到读者留言，说我的文章让他想通了辞职。我吓了一跳，赶紧回：想通可以，别冲动，骑驴找马。文字是有力量的，不能乱用。
    date: 2026/10/17
    from: 马老师
  - content: 读《堂吉诃德》，笑完之后有点心酸。我们都曾是堂吉诃德，后来都被生活磨成了桑丘。不是不好，只是偶尔会想：那个要当骑士的少年去哪了？
    date: 2026/10/17
    from: 马老师
  - content: 今天做饭，切到手了。贴上创可贴继续。成年人的坚强，就是这么具体：疼，但手不能停。
    date: 2026/10/17
    from: 马老师
  - content: 看到年轻人说"躺平"，我挺理解的。不是不想努力，是努力了发现方向不对。与其跑错方向，不如先躺下看看地图。
    date: 2026/10/17
    from: 马老师
  - content: 写《红与黑》那篇，查资料查到半夜。于连的故事告诉我们：靠钻营上位的人，最后都会被反噬。但更扎心的是：不钻营的人，连上位的机会都没有。
    date: 2026/10/17
    from: 马老师
  - content: 今天去超市，看到特价鸡蛋，一堆大妈在抢。我也抢了两盒。不是缺那几块钱，是不想输。这种心态，叫"穷人思维"，我有，我承认。
    date: 2026/10/17
    from: 马老师
  - content: 晚上跟朋友喝酒，他说"羡慕你自由"。我说"羡慕你有工资"。相视一笑，碰杯。成年人的羡慕，都是双向的。
    date: 2026/10/17
    from: 马老师
  - content: 读胡适，喜欢他那句"多研究些问题，少谈些主义"。放在今天，就是：少刷点口号，多解决点实际问题。
    date: 2026/10/17
    from: 马老师
  - content: 今天博客又多了 3 篇文章，231 篇了。数字看着挺唬人，但我知道，真正被记住的可能就几篇。不过没关系，写，就对了。
    date: 2026/10/17
    from: 马老师
  - content: 凌晨两点，邻居还在装修。想投诉，又怕得罪人。最后戴上耳机，继续写。这就是成年人的处世之道：惹不起，躲得起。
    date: 2026/10/17
    from: 马老师
  - content: 看到一句话："不要在深夜做决定。"深以为然。我深夜做的最冲动的决定，就是决定"明天开始早睡"。
    date: 2026/10/17
    from: 马老师
  - content: 写《战争与和平》那篇，最大的感触：托尔斯泰写了 6 年，我写了 6 天。他写的是史诗，我写的是读后感。但没关系，读后感也是诚意。
    date: 2026/10/17
    from: 马老师
  - content: 今天去银行，排队一小时，办业务五分钟。工作人员说"系统慢"。我想：系统慢可以等，人生慢，不行。
    date: 2026/10/17
    from: 马老师
  - content: 读《麦田里的守望者》，霍尔顿说大人都是"假模假式"。长大后我发现：他说得对，但我们都成了他说的那种人。
    date: 2026/10/17
    from: 马老师
  - content: 今天做了体检，医生说"注意休息"。我说"我失业了，天天休息"。医生说"那注意运动"。好吧，闭环了。
    date: 2026/10/17
    from: 马老师
  - content: 看到一对情侣吵架，女生说"你根本不懂我"，男生说"你也没懂我"。路过的我心想：懂不懂不重要，别在马路上吵，挡路了。
    date: 2026/10/17
    from: 马老师
  - content: 写《百年孤独》那篇，"多年以后"开头写了三遍。马尔克斯一句话把时间折叠了，我三句话还没把意思说明白。大师就是大师。
    date: 2026/10/17
    from: 马老师
  - content: 今天把阳台的花浇死了。查了下，是水浇多了。爱这东西，多了也淹死人，花如此，人亦然。
    date: 2026/10/17
    from: 马老师
  - content: 失业后，时间多了，朋友少了。以前是"没时间聚"，现在是"没事由聚"。成年人的友谊，需要"事由"来维持，挺现实的。
    date: 2026/10/17
    from: 马老师
  - content: 读《源氏物语》，光源氏一生风流，最后孤独终老。想告诉年轻人：年轻时欠的情债，中年都要还，还附带利息。
    date: 2026/10/17
    from: 马老师
  - content: 今天去面试，HR 问"期望薪资"。我说"按市场价"。他说"具体点"。我说"比上家高 20%"。他笑了，我也笑了。都懂。
    date: 2026/10/17
    from: 马老师
  - content: 晚上看剧，看到主角逆袭，热血沸腾。关掉电视，看看自己，还是躺在沙发上。逆袭是别人的，生活是自己的。
    date: 2026/10/17
    from: 马老师
  - content: 写《了不起的盖茨比》那篇，黛西的声音"像金钱"。 Fitzgerald 讽刺的是：一百年后，我们还是听得出金钱的声音，还趋之若鹜。
    date: 2026/10/17
    from: 马老师
  - content: 今天帮朋友搬家，累得腰疼。朋友说"请你吃饭"。结果吃了沙县。友谊的价值，有时候就是一碗飘香拌面。
    date: 2026/10/17
    from: 马老师
  - content: 看到一句话："自律给我自由。"我试了三天，第四天放弃了。自由诚可贵，自律价更高，若为奶茶故，两者皆可抛。
    date: 2026/10/17
    from: 马老师
  - content: 读《我是猫》，那只猫看人类，就像我看那些天天开会的人：忙得可笑，但又不得不承认，没他们不行。
